user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Long timeouts because the auth_request subrequest blocks while
    # Sablier waits for the model to become healthy. Match this to your
    # slowest model's cold-start time (LLMs commonly take 30-90 s).
    proxy_connect_timeout 10s;
    proxy_send_timeout    180s;
    proxy_read_timeout    180s;

    log_format main '$remote_addr [$time_local] "$request" '
                    '$status $body_bytes_sent rt=$request_time '
                    'upstream=$upstream_addr ut=$upstream_response_time';
    access_log /var/log/nginx/access.log main;

    # Sablier API. Used only as the auth_request target.
    upstream sablier_api { server sablier:10000; }

    # Per-model upstreams. Resolved at request time (not config-load time)
    # so the upstream container can be Stopped at boot without nginx
    # refusing to start.
    resolver 127.0.0.11 valid=10s ipv6=off;

    include /etc/nginx/conf.d/*.conf;
}
