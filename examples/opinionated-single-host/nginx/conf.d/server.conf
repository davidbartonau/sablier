server {
    listen 80;
    server_name _;

    # Health endpoint so you can verify nginx is alive without waking anything.
    location = /healthz {
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }

    ##########################################################################
    # /api/whisper/  ->  whisper-test  (peak=2000, priority=10)
    ##########################################################################
    location /api/whisper/ {
        auth_request /_sablier_whisper;
        # Variable in proxy_pass = lazy DNS via the `resolver` directive in
        # nginx.conf. Lets nginx start even when the upstream is Stopped.
        #
        # GOTCHA: with a variable in proxy_pass, nginx ignores the trailing
        # slash trick that strips the location prefix. Instead nginx forwards
        # the *full* original URI. Use `rewrite ... break` to do the strip
        # explicitly. Without this, /api/whisper/foo arrives at the upstream
        # as /api/whisper/foo, not /foo — most real model servers will 404.
        set $whisper_up "whisper-test:80";
        rewrite ^/api/whisper/(.*)$ /$1 break;
        proxy_pass http://$whisper_up;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
    location = /_sablier_whisper {
        internal;
        # GOTCHA: nginx auth_request forwards the original request method
        # and Content-Type to the auth upstream. If the original is a POST
        # with `Content-Type: multipart/form-data`, sablier's gin binder
        # tries to parse a body that isn't there (we have
        # proxy_pass_request_body off) and returns 400 Validation Failed.
        # `proxy_method GET` + clearing Content-Type guarantee a clean
        # GET regardless of what the user is doing.
        proxy_method GET;
        proxy_pass http://sablier_api/api/strategies/blocking?names=whisper-test&session_duration=2h&timeout=120s;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Content-Type "";
    }

    ##########################################################################
    # /api/embeddings/  ->  embed-test  (peak=4000, priority=50)
    ##########################################################################
    location /api/embeddings/ {
        auth_request /_sablier_embed;
        set $embed_up "embed-test:80";
        rewrite ^/api/embeddings/(.*)$ /$1 break;
        proxy_pass http://$embed_up;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
    location = /_sablier_embed {
        internal;
        proxy_method GET;
        proxy_pass http://sablier_api/api/strategies/blocking?names=embed-test&session_duration=2h&timeout=120s;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Content-Type "";
    }

    ##########################################################################
    # /api/llm/  ->  llm-test  (peak=5000, priority=80)
    # Combined declared peak: 2000+4000+5000 = 11000 > 8000 budget,
    # so loading the third forces eviction of one or more earlier models.
    ##########################################################################
    location /api/llm/ {
        auth_request /_sablier_llm;
        set $llm_up "llm-test:80";
        rewrite ^/api/llm/(.*)$ /$1 break;
        proxy_pass http://$llm_up;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
    location = /_sablier_llm {
        internal;
        proxy_method GET;
        proxy_pass http://sablier_api/api/strategies/blocking?names=llm-test&session_duration=2h&timeout=120s;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Content-Type "";
    }
}
